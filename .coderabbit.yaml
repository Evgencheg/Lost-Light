# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ru-RU
tone_instructions: Пиши по-русски, кратко и по делу. Один конкретный комментарий с предложенным исправлением лучше общих советов. Без похвалы, эмодзи и воды. Не придирайся к стилю старого кода, который PR не трогал.
early_access: true
reviews:
  high_level_summary_in_walkthrough: true
  suggested_labels: false
  path_filters:
  - '!RobustToolbox/**'
  - '!Resources/Maps/**'
  - '!Resources/Changelog/**'
  - '!**/*.png'
  - '!**/*.ogg'
  - '!Content.Server.Database/Migrations/**/*.Designer.cs'
  - '!Content.Server.Database/Migrations/**/*ModelSnapshot.cs'
  path_instructions:
  - path: RobustToolbox
    instructions: Сабмодуль движка в PR меняться не должен. Любое изменение указателя сабмодуля - блокирующее замечание.
  - path: '**/*'
    instructions: |-
      Подробные правила - docs/review.md.
      Проект: Lost Light - русскоязычная сборка Space Station 14 на базе Starlight. Основной язык игры ru-RU.
      Приоритеты ревью (по убыванию):
      1. Правки в RobustToolbox (движок) - запрещены.
      2. Секреты в репозитории: токены, пароли, API-ключи, вебхуки, строки подключения, приватные адреса. Любая находка - блокирующий комментарий.
      3. Размещение и пометки. Новый код и ресурсы должны лежать в папках `_LP` (Content.*/_LP, Resources/*/_LP).
         Портированный код - в папке namespace источника (_Funkystation, _Goobstation, _Corvax, _Orion и т. д.), не в _LP.
         Любая правка файла вне _LP (Starlight, SS14, порты) должна быть помечена: C# `// LP edit start` / `// LP edit end` или `// LP edit` в конце строки;
         YAML `# LP edit start` / `# LP edit end` или `# LP edit`; XAML `<!-- LP edit -->` или `<!-- LP edit start -->` / `<!-- LP edit end -->`.
         Правка больше одной строки - только блоком start / end. Пояснение в пометке (`// LP edit start - зачем`) - только если причина неочевидна из кода.
         Удаление чужого кода - строка `// LP edit - убрано ...` / `# LP edit - убрано ...` на месте удалённого.
         НЕ помечаются: файлы .ftl, директивы using в C#, всё в папке _Corvax, перевод существующих страниц гайдбука. Чужие пометки (Starlight, NullLink, DEN edit, Corvax и т. п.) не трогаются;
         в портированном коде сохраняется пометка источника, LP edit поверх неё не ставится; наши собственные правки поверх порта помечаются LP edit.
      4. Ошибки предсказания и сети, утечки скрытых данных, отсутствие серверной валидации ввода клиента.
      5. Текст для игрока без локализации.
      6. Дублирование существующих механик, хардкод ID прототипов, путей к звукам и спрайтам, магические числа.
      7. Отсутствие проверки для рискованных изменений.
      8. Один PR - одна тема. Все изменения PR должны служить одной цели и выпускаться и откатываться независимо от остального.
         Если смешаны несвязанные изменения (разные баги, фича вместе с клинапом или рефакторингом чужого кода, порт вместе с правками другого контента) -
         укажи, какие изменения не относятся к основной теме, и предложи вынести их в отдельные PR.
         Исключения: вливание апстрима (ветка upstream, PR «Upstream» / «Merge Starlight/starlight-dev»), массовые переводы локализации,
         PR, где в описании явно сказано, что это согласованный сборник мелких фиксов.
      Не требуй правок стиля в коде, который PR не менял. Не проси диздок или запись в docs/features.md для мелочей
      (баги, тексты, спрайты, числа, мелкие предметы, мелкие порты) - документируются только крупные фичи.
      Дефолты CVar в коде (`CVarDef.Create`) менять нельзя - значения задаются в пресете Resources/ConfigPresets/_LP/LP.toml или в закрытом конфиге.
      В текстах репозитория (md, доки) используется дефис с пробелами « - », а не длинное тире.
      В описании PR должны быть шаги проверки изменений; проверки, которые не проводились, не должны заявляться как выполненные.
      Баг в коде Starlight у нас не правится: фикс отправляется в Starlight, мы ждём вливания. Переводы ru-RU строк Starlight правятся у нас.
  - path: '**/*.cs'
    instructions: |-
      Проверяй по соглашениям SS14 / Robust:
      - ECS: компоненты - только данные (`[RegisterComponent]`, `sealed partial`, `[DataField]` без явного ключа), вся логика - в системах.
        Сеттеры с побочными эффектами в компонентах - ошибка.
      - Схема методов: тонкий обработчик `On...Event` → публичный `Try...` (вызывает `Can...`, возвращает bool) → `Can...` (только проверки,
        ничего не меняет; попап допустим при `quiet == false`) → `Do...` (изменение после проверки).
      - Публичные API систем принимают сущность первым аргументом, лучше `Entity<T?>`, с `Resolve` в начале. Необязательная ссылка - `EntityUid?`, не `EntityUid.Invalid`.
      - Зависимости - `[Dependency] private XSystem _x = default!;` (без `readonly`: движок выдаёт RA0051), а не `EntitySystem.Get<T>()` / `IoCManager.Resolve<T>()` внутри методов систем.
      - Без хардкода: `ProtoId<T>` / `EntProtoId` вместо строковых ID, `SoundSpecifier`, `SpriteSpecifier`, `LocId`, настраиваемые `[DataField]` или CVar.
      - Время симуляции - `TimeSpan` и `IGameTiming.CurTime`, таймеры с поддержкой паузы (`[AutoPausedField]`, `TimeOffsetSerializer`), не `DateTime`.
      - Классы `sealed`, `abstract`, `static` или `[Virtual]`; file-scoped namespace; namespace совпадает с путём (`Content.Server._LP.Foo`).
      - Текст для игрока - только `Loc.GetString("key", ("arg", value))`, без конкатенации фраз, без сравнения локализованных строк, без показа сырых ID и enum.ToString().
      - Производительность: без широких сканов и аллокаций в `Update` и горячих событиях, без лямбд с захватом в горячих путях,
        без `Dirty` каждый тик и `Dirty` неизменённого значения; итерация через `EntityQueryEnumerator` с нужными компонентами.
      - `async void` допустим только в обработчиках (EUI и т. п.) - отметь, если внутри нет обработки исключений, а ошибка может уронить сервер.
      - Плейтайм меняется только через `PlayTimeTrackingManager` (он пишет в БД и в NullLink); прямой `IServerDbManager.UpdatePlayTimes` - ошибка.
      - Админ-логи - через `ToPrettyString` для сущностей.
      - XML-доки нужны на публичные API систем и неочевидные `DataField`. Комментарии объясняют «почему», а не синтаксис.
      - Наши методы и поля в чужом классе собираются в `#region LP`.
      - Подписки на события - атрибутом `[SubscribeLocalEvent]` на методе-обработчике, без лямбд.
      - Наш код в чужой системе - лучше partial-класс в `_LP` и одна помеченная строка-вызов в чужом файле.
      - Логика не впихнута в одну строку ради короткого diff. Новых предупреждений компилятора в изменённых файлах быть не должно.
  - path: Content.Shared/**/*.cs
    instructions: |-
      Shared не должен зависеть от Content.Server и Content.Client.
      Интерактивный геймплей по умолчанию предсказываемый, если это возможно; если нет - в PR должно быть объяснение.
      Сетевые компоненты: `[NetworkedComponent, AutoGenerateComponentState]`, `[AutoNetworkedField]` только на полях, нужных клиенту;
      после каждого изменения сетевого поля - `Dirty` (или `DirtyField` при `fieldDeltas: true`).
      В предсказываемом коде запрещены `PopupEntity` и `PlayPvs` - нужны `PopupPredicted` / `PopupClient` и `PlayPredicted`;
      спавн и удаление - `PredictedSpawn*` / `PredictedDel` / `PredictedQueueDel`; ввод BUI - `SendPredictedMessage`;
      `IRobustRandom` без детерминированного сида - ошибка; неидемпотентные эффекты - под `IGameTiming.IsFirstTimePredicted`.
      Сетевые сообщения: `[Serializable, NetSerializable]`, `NetEntity` вместо `EntityUid`, маленькие payload.
      Не сетить всем скрытые данные (статус антагониста, цели, содержимое тайников, админские данные) - только владельцу или сессии.
  - path: Content.Server/**/*.cs
    instructions: |-
      Сервер авторитетен. Любой ввод от клиента (сетевые события, сообщения BUI и EUI, команды) проверяется на сервере:
      сессия и её сущность, права (AdminFlags), дальность, стадия жизни цели, владение, кулдауны, доступность действия, актуальность после предсказания.
      Видимость кнопки на клиенте защитой не считается.
      `[NetworkedComponent]` в Content.Server - ошибка размещения.
      Новые CVar-ы - в Content.Shared/_LP/CCVar/ с пустым или безопасным дефолтом; секреты в дефолтах запрещены.
  - path: Content.Client/**/*.cs
    instructions: |-
      Клиент - только презентация: UI, визуализаторы, оверлеи. Игровых решений и проверок прав в клиентском коде быть не должно.
      Окна создаёт и закрывает UI-контроллер (`UIController`, зависимости систем через `[UISystemDependency]`), а не системы сущностей.
      Подписки на C#-события окон и контроллеров должны сниматься при закрытии.
      В code-behind XAML подписки на события контролов - только после `RobustXamlLoader.Load(this)`.
  - path: '**/*.xaml'
    instructions: |-
      Все тексты - через `{Loc 'key'}`, без захардкоженных строк.
      Вёрстка должна выдерживать русские строки (на 20-40 % длиннее английских): `ClipText`, тултипы, минимальные ширины, растягивание.
      Использовать существующие контролы и style classes (FancyWindow, BoxContainer, LabelHeading, ButtonCaution и т. д.), а не свои стили.
      Правки чужих XAML - с `<!-- LP edit -->`, многострочные - блоком `<!-- LP edit start -->` / `<!-- LP edit end -->`.
  - path: Content.Server.Database/**
    instructions: |-
      Изменение схемы БД требует миграций для обеих БД: SQLite и Postgres.
      Апстримные таблицы не меняем - для данных только нашей сборки нужны свои таблицы (один-к-одному со связью на существующие).
      Отметь риск потери данных при миграции. В БД не хранится готовый текст для игрока.
  - path: Resources/Prototypes/**/*.yml
    instructions: |-
      Порядок полей прототипа: type, abstract, parent, id, categories, name, suffix, description, components.
      Элементы под `components:` без дополнительного отступа; прототипы разделены одной пустой строкой; только пробелы, без табов.
      ID - PascalCase, наши ID с префиксом `LP`; ключи YAML - camelCase. `suffix` - для различения в меню спавна.
      Пометка `- # LP edit` как элемент списка ломает прототип (пустой элемент) - пометка должна быть комментарием без дефиса.
      Для портов partial не используются: правки чужих прототипов под порт вносятся прямо в файл с пометкой источника порта (наши правки поверх - с `# LP edit`) - не проси переделать их в partial.
      Удалять прототипы Starlight нельзя - для этого Resources/IgnoredPrototypes/.
      Предпочитай наследование (`parent`) копированию списков компонентов; не дублируй существующие компоненты и механики.
      Тексты name/description в YAML английские; перевод сущностей живёт в Resources/Locale/ru-RU/ss14-ru/prototypes/.
      Удаление чужого - строка `# LP edit - убрано ...` на месте удалённого.

      Если PR правит прототип визардов или Starlight ради НАШЕГО контента (не порта) - оставь замечание с требованием перенести правку в partial-прототип в Resources/Prototypes/_LP/Partials/<Тема>/<тема>.yml (`- type: !PartialOnly entity`, `id: ...`, только изменённые поля) и предложи готовый partial.
      Partial НЕ требуй, если правка:
      - пришла с портом (рядом пометка источника: Corvax, WL-Changes, Corvax-WL-Changes, DEN и т. п., или PR - порт);
      - меняет `parent`;
      - удаляет прототип из большого файла;
      - удаляет или меняет элемент-маппинг в списке (`- map: [...]`, `- !type:...`) или вставляет его в середину списка;
      - требует переписать длинный список целиком (больше ~20 строк).
      Такие правки остаются в файле с `# LP edit`.
  - path: Resources/Prototypes/_LP/Partials/**
    instructions: |-
      Partial-прототипы лежат в файлах по темам (`<Тема>/<тема>.yml`), а не по пути оригинала.
      Обязателен `type: !PartialOnly ...`. У `!type:CreateVariants` список `values` - внутри `id`, а не рядом. `localizedDataset` через `CreateVariants` не сливается. `!PartialModified` не использовать.
      `parent` через partial не менять. `!Remove` не работает для элементов-маппингов (`- map: [...]`, `- !type:...`), `!CombineIndex` ненадёжен для удаления.
  - path: Resources/Locale/ru-RU/**/*.ftl
    instructions: |-
      Это русская локализация - главный язык игры. Проверяй:
      - перевод есть (нет английского текста там, где он не допустим: ники, бренды, синтаксис консольных команд, формулы - допустимы);
      - переменные Fluent (`{ $name }`), функции (`CAPITALIZE`, `GENDER` и др.), разметка (`[color]`, `[bold]`) и селекторы совпадают с en-US по набору переменных;
      - грамматика, род и падежи (через селекторы по `GENDER`), естественный игровой тон без канцелярита;
      - единая терминология: НаноТрейзен, СБ, ГСБ, смотритель, МТГ, СРП, «заболтировать / разболтировать», код «Зелёный», суффикс «Заполненный»;
      - названия сущностей с маленькой буквы.
      Пометки LP edit в .ftl ставить НЕ нужно - не проси их.
      Наши строки (не из апстрима) должны лежать в Resources/Locale/ru-RU/_LP/; ru-файл вне _LP без пары в en-US будет удалён скриптом Tools/localize/localize.py.
      Ключи `ent-` должны лежать в ru-RU/ss14-ru/prototypes/, а не в других файлах.
  - path: Resources/Locale/en-US/**/*.ftl
    instructions: |-
      en-US в этой сборке - только источник ключей для ru-RU; качество английского текста не важно, не придирайся к нему.
      Для нашего контента en-US/_LP не заводится. Для портов en-US-файл должен лежать в en-US/_<Namespace>/ рядом с ru-RU-парой.
      Пометки LP edit в .ftl не нужны.
  - path: Resources/ServerInfo/**/*.xml
    instructions: |-
      Страницы гайдбука. При переводе меняются только текст, `Caption="..."` и `textlink="..."`; теги и остальные атрибуты должны остаться как в оригинале.
      XML должен быть валидным. Тон нейтральный, без «меты» и тактических советов.
      `GuideEntityEmbed` показывает сущность только на клиенте - серверные описания в ней не появятся.
      Наши страницы - в Resources/ServerInfo/_LP/, прототипы guideEntry - в Resources/Prototypes/_LP/Guidebook/.
      Перевод существующих страниц пометками LP edit не помечается. Наш новый контент в чужой странице - `<!-- LP edit -->`.
  - path: Resources/Textures/**/meta.json
    instructions: |-
      Обязательны `license` (SPDX, например CC-BY-SA-3.0) и `copyright` с автором и источником (ссылка или коммит).
      Ассеты без ясной лицензии, All Rights Reserved или некоммерческие (CC-BY-NC) без явного согласования - блокирующее замечание.
      Имена состояний должны совпадать с YAML; для анимации с несколькими направлениями `delays` - отдельный список на каждое направление.
  - path: Resources/Audio/**/attributions.yml
    instructions: Каждый файл папки описан ровно одной записью с полями files, license (SPDX, регистрозависимо), copyright, source.
  - path: Resources/ConfigPresets/**
    instructions: Только несекретные значения. Токены, пароли, ключи, вебхуки и строки подключения сюда класть нельзя - только в закрытый конфиг сервера.
  - path: docs/design/**
    instructions: |-
      Диздок по шаблону docs/design/_TEMPLATE.md: Суть, Механика (все числа с обоснованием), Баланс, Затронутые системы,
      Происхождение (для порта - источник, лицензия, строка в LEGAL.md), Настройки, Как выключить или удалить, Открытые вопросы, История.
      Раздел «Как выключить или удалить» должен позволять убрать фичу без автора.
  - path: LEGAL.md
    instructions: Каждый namespace-источник портов в репозитории должен быть в таблице с правильной лицензией и ссылкой. Тексты MIT и Starlight License удалять нельзя.
  - path: .github/**
    instructions: |-
      Секреты - только через secrets / environments, без значений в файлах. Параметры (FORK_ID, адреса) - через vars, без хардкода.
      Тексты для GitHub (шаблоны, комментарии ботов) - на русском.
  finishing_touches:
    unit_tests:
      enabled: false
  auto_approvals:
    allow_author_approval: false
  pre_merge_checks:
    custom_checks:
    - name: Одна тема
      mode: warning
      instructions: |-
        Пройдено, если все изменения PR служат одной цели и могут быть выпущены и откачены вместе.
        Не пройдено, если смешаны несвязанные изменения: разные баги, фича вместе с клинапом или рефакторингом чужого кода, порт вместе с правками другого контента. Укажи, что вынести в отдельный PR.
        Всегда пройдено для вливания апстрима (ветка upstream, заголовок Upstream или Merge Starlight), массовых переводов и PR, где в описании прямо сказано, что это согласованный сборник мелких фиксов.
    - name: Шаги проверки
      mode: warning
      instructions: |-
        Пройдено, если в описании PR есть шаги проверки изменений и не заявлены проверки, которых не было.
        Для мелочей без изменения поведения (опечатка, перевод, спрайт) достаточно короткой строки о том, как проверено.
knowledge_base:
  code_guidelines:
    filePatterns:
    - docs/review.md
    - .github/CONTRIBUTING.md
    - LEGAL.md
    - docs/process.md
    - docs/design/README.md
    - files: docs/mapping-checklist.md
      applyTo: Resources/Prototypes/_LP/Maps/**
issue_enrichment:
  auto_enrich:
    enabled: true
