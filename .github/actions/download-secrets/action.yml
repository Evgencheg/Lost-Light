name: Download

inputs:
  secrets-token:
    description: Токен доступа на чтение закрытого репозитория
    required: true
  secrets-repository:
    description: Закрытый репозиторий с частями сборки (владелец/имя)
    required: false
    default: Lost-Paradise-Project/NewSecrets

outputs:
  downloaded:
    description: "'true', если закрытые части скачаны"
    value: ${{ steps.download.outputs.downloaded }}

runs:
  using: composite
  steps:
    - name: Download parts
      id: download
      shell: bash
      env:
        SECRETS_TOKEN: ${{ inputs.secrets-token }}
        SECRETS_REPOSITORY: ${{ inputs.secrets-repository }}
      run: |
        # Секретов нет
        if [ -z "$SECRETS_TOKEN" ]; then
          echo "::notice::Секреты недоступны, части не скачаны."
          echo "downloaded=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Токен передаётся заголовком, а не в URL: git не теряет его при редиректах GitHub
        AUTH_HEADER="$(printf 'x-access-token:%s' "$SECRETS_TOKEN" | base64 -w0)"
        echo "::add-mask::$AUTH_HEADER"

        GIT_CONFIG_COUNT=1 \
        GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
        GIT_CONFIG_VALUE_0="Authorization: basic $AUTH_HEADER" \
        GIT_TERMINAL_PROMPT=0 \
          git clone --depth 1 "https://github.com/${SECRETS_REPOSITORY}.git" NewSecrets

        mv NewSecrets/PResources/PPrototypes Resources/Prototypes/
        mv NewSecrets/PResources/PTextures Resources/Textures/
        mv NewSecrets/PShared Content.Shared/PShared
        mv NewSecrets/PServer Content.Server/PServer
        mv NewSecrets/PClient Content.Client/PClient
        rm -rf NewSecrets
        echo "downloaded=true" >> "$GITHUB_OUTPUT"
