name: Close PRs on master

on:
  pull_request_target:
    types: [ opened, ready_for_review ]

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ (github.head_ref == 'master' || github.head_ref == 'stable') && github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - uses: superbrothers/close-pull-request@v3
      with:
        comment: "Спасибо за вклад! Похоже, этот pull request создан из ветки `master` или `stable` вашего форка. Так делать [не стоит](https://jmeridth.com/posts/do-not-issue-pull-requests-from-your-master-branch/), поэтому PR закрыт автоматически. \n \n Рекомендуем ознакомиться с [руководством по работе с git в SS14](https://docs.spacestation14.com/en/general-development/setup/git-for-the-ss14-developer.html). \n \n Перенести изменения в отдельную ветку можно [этими командами](https://ohshitgit.com/#accidental-commit-master). После этого откройте PR заново уже из новой ветки."

    # If you prefer to just comment on the pr and not close it, uncomment the below and comment the above

    # - uses: actions/github-script@v7
    #   with:
    #     script: |
    #       github.rest.issues.createComment({
    #         issue_number: ${{ github.event.number }},
    #         owner: context.repo.owner,
    #         repo: context.repo.repo,
    #         body: "Спасибо за вклад! Похоже, этот pull request создан из ветки `master` или `stable` вашего форка. Рекомендуем ознакомиться с [руководством по работе с git в SS14](https://docs.spacestation14.com/en/general-development/setup/git-for-the-ss14-developer.html). \n\n Перенести изменения в отдельную ветку можно командой `git branch <имя_ветки>`, после чего сбросить `master`. \n\n Этот PR не будет закрыт автоматически, но сопровождающий может закрыть его по этой причине."
    #       })
