name: RSI Validator

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ master, stable ]
  merge_group:
  pull_request:
    paths:
      - '**.rsi/**'

jobs:
  validate_rsis:
    name: Validate RSIs
    if: github.actor != 'Lost-Paradise-Bot' && github.actor != 'starlightgithub[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Submodule
        run: git submodule update --init
      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Download parts
        if: ${{ vars.SECRETSLINK != '' }}
        uses: ./.github/actions/download-secrets
        with:
          secrets-url: ${{ secrets.SECRETS }}

      - name: Install Python dependencies
        run: |
          pip3 install --ignore-installed --user pillow jsonschema
      - name: Validate RSIs
        run: |
          python3 Tools/Schemas/validate_rsis.py Resources/
