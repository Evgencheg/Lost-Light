name: Discord Publish

concurrency:
  group: publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: prod

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v3

    - name: Set up SSH
      env:
        ACTIONS_SSH_KEY: ${{ secrets.ACTIONS_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$ACTIONS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Test SSH Connection
      run: ssh -T git@github.com || exit 0

    - name: Publish changelog (Discord)
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_WEBHOOK }}
        DISCORD_CHANGELOG_ROLE_ID: ${{ vars.DISCORD_CHANGELOG_ROLE_ID }}
        CHANGELOG_FILE_PATH: 'Resources/Changelog/ChangelogLP.yml'

    - name: Commit and push changes
      run: |
        git config user.name "${{ vars.CHANGELOG_USER }}"
        git config user.email "${{ vars.CHANGELOG_EMAIL }}"
        git add "Resources/Changelog/ChangelogLP.yml"
        git add "Tools/changelogs/sent_changelog_ids.yml"
        if git diff --cached --quiet; then
          echo "Нет изменений для коммита."
        else
          git commit -m "Обновлены отправленные чейнджлоги [skip ci]"
          git push git@github.com:${{ github.repository }}.git HEAD:master
        fi
