name: Check Merge Conflicts

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  Label:
    if: ( github.event.pull_request.draft == false ) && ( github.actor != 'Lost-Paradise-Bot' && github.actor != 'starlightgithub[bot]' )
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Check for Merge Conflicts
        uses: eps1lon/actions-label-merge-conflict@v3.0.0
        with:
          dirtyLabel: "Статус: Конфликт"
          repoToken: "${{ secrets.BOT_TOKEN }}"
          commentOnDirty: "В этом PR есть конфликты слияния. Пожалуйста, разрешите их, чтобы мы могли рассмотреть изменения."
