name: "Labels: Review"

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: true

on:
  pull_request_target:
    types: [ opened, reopened, synchronize, ready_for_review, edited, review_requested, review_request_removed ]
  workflow_run:
    workflows: [ "Labels: Review Trigger" ]
    types: [ completed ]

permissions: {}

jobs:
  label:
    name: Label by team reviews
    if: github.actor != 'Lost-Paradise-Bot' && github.actor != 'starlightgithub[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Update review labels
        uses: actions/github-script@v7
        env:
          REVIEW_TEAMS: ${{ vars.REVIEW_TEAMS }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          LABEL_APPROVED: "Статус: Одобрено"
          LABEL_CHANGES: "Статус: Ожидает изменений"
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const headSha = process.env.HEAD_SHA;
              const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });
              prNumber = pulls.find(p => p.head.sha === headSha)?.number;
            }
            if (!prNumber) {
              core.info("Открытый PR не найден, пропускаем.");
              return;
            }

            const teams = (process.env.REVIEW_TEAMS || "").split(",").map(t => t.trim()).filter(Boolean);
            if (teams.length === 0) {
              core.setFailed("Не задана переменная REVIEW_TEAMS.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 });
            const latest = new Map();
            for (const review of reviews) {
              if (["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(review.state))
                latest.set(review.user.login, review.state);
            }

            async function isTeamMember(username) {
              for (const team_slug of teams) {
                try {
                  const { data } = await github.rest.teams.getMembershipForUserInOrg({ org: owner, team_slug, username });
                  if (data.state === "active")
                    return true;
                } catch (e) {
                  if (e.status !== 404)
                    throw e;
                }
              }
              return false;
            }

            let approved = false;
            let changesRequested = false;
            for (const [login, state] of latest) {
              if (state === "DISMISSED" || !(await isTeamMember(login)))
                continue;
              if (state === "APPROVED")
                approved = true;
              if (state === "CHANGES_REQUESTED")
                changesRequested = true;
            }

            async function addLabel(name) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: [name] });
            }
            async function removeLabel(name) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name });
              } catch (e) {
                if (e.status !== 404)
                  throw e;
              }
            }

            const labelApproved = process.env.LABEL_APPROVED;
            const labelChanges = process.env.LABEL_CHANGES;

            // Запрос изменений от команды важнее одобрения
            if (changesRequested) {
              await addLabel(labelChanges);
              await removeLabel(labelApproved);
              core.info(`PR #${prNumber}: команда запросила изменения.`);
            } else if (approved) {
              await addLabel(labelApproved);
              await removeLabel(labelChanges);
              core.info(`PR #${prNumber}: одобрено командой.`);
            } else {
              await removeLabel(labelApproved);
              core.info(`PR #${prNumber}: нет одобрений от команды.`);
            }
