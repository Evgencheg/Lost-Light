name: Publish Release

concurrency:
  group: publish-release
  cancel-in-progress: true

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      # hybrid-acz: клиент встраивается в серверную сборку, отдельный CDN не нужен
      - name: Package server
        run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-arm64 --hybrid-acz

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release/SS14.Server_*.zip
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
