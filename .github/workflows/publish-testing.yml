name: Publish Public

concurrency:
  group: publish-public
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    environment: public
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all tags (RobustToolbox)
        run: |
          cd RobustToolbox
          git fetch --all --tags

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet restore
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging -c Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --platform linux-x64 --platform win-x64 --platform osx-arm64

      - name: Package client
        run: dotnet run --project Content.Packaging client --no-wipe-release

      - name: Publish version
        run: Tools/publish_multi_request.py
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
          FORK_ID: ${{ vars.FORK_ID_PUBLIC }}
          ROBUST_CDN_URL: ${{ vars.ROBUST_CDN_URL }}
