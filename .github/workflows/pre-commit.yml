name: Pre-commit check
on:
  pull_request_target:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, stable ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base
          sparse-checkout: .pre-commit-config.yaml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: pre-commit/action@v3.0.1
        id: run
        continue-on-error: true
        with:
          extra_args: --all-files --config .base/.pre-commit-config.yaml

      - name: Push autofixes
        if: steps.run.outcome == 'failure'
        env:
          REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.event.pull_request.head.ref }}
          TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          git diff --quiet && exit 1
          git config user.name "${{ vars.CHANGELOG_USER }}"
          git config user.email "${{ vars.CHANGELOG_EMAIL }}"
          git commit -am "Авто фиксы кода"
          git push "https://x-access-token:$TOKEN@github.com/$REPO.git" "HEAD:$REF"
