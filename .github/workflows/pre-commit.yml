name: Pre-commit check
on:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, stable ]

concurrency:
  group: pre-commit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        id: run
        run: pre-commit run --all-files --show-diff-on-failure --color=always
        continue-on-error: true

      # Пушим фиксы только в ветки этой репы - в форк GITHUB_TOKEN писать не может
      - name: Commit autofixes
        if: steps.run.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "Хуки упали, но ничего не исправили - нужна ручная правка"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Авто фиксы кода"
          git push

      - name: Fail on fork PR
        if: steps.run.outcome == 'failure' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "PR из форка - автофикс недоступен, запусти pre-commit локально и запушь исправления"
          exit 1

      # Повторный прогон: падает, если остались ошибки, которые хуки не чинят сами
      - name: Re-run pre-commit
        if: steps.run.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: pre-commit run --all-files --show-diff-on-failure --color=always
