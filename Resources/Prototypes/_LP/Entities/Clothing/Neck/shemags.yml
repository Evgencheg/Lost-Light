# Шемаги: одна серая текстура на вид (down - на шее, up - на лице), цвет задаётся тоном.
# Белый шемаг-маска (whiteup.rsi) нарисован отдельно и тонировкой не заменяется.

- type: entity
  parent: ClothingMaskBase
  id: LPPClothingMaskShemagBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _LP/Clothing/Neck/shemags/shemag_up.rsi
  - type: Clothing
    sprite: _LP/Clothing/Neck/shemags/shemag_up.rsi
  - type: IdentityBlocker

- type: entity
  parent: ClothingNeckBase
  id: LPPClothingNeckShemagWhite
  name: White shemag
  description: A warm silk fabric that protects from dust and cold, as well as gives brutality and tacticool to the wearer.
  components:
  - type: Sprite
    sprite: _LP/Clothing/Neck/shemags/shemag_down.rsi
    layers:
    - state: icon
      color: "#DCDEFA"
  - type: Clothing
    sprite: _LP/Clothing/Neck/shemags/shemag_down.rsi
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#DCDEFA"
  - type: ToggleableClothing
    clothingPrototype: LPPClothingMaskShemagWhite
    requiredSlot:
    - neck
    slot: mask
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}

- type: entity
  parent: LPPClothingNeckShemagWhite
  id: LPPClothingNeckShemagGreen
