- type: entity
  parent: [ ClothingOuterStorageBase, AllowSuitStorageClothing ]
  id: LPPClothingOuterVestPG
  name: PG vest
  description: A synthetic armor vest. This one has added webbing and ballistic plates. For all PG army needs.
  components:
  - type: Sprite
    sprite: _LP/Clothing/OuterClothing/Armor/pg-vest.rsi
  - type: Clothing
    sprite: _LP/Clothing/OuterClothing/Armor/pg-vest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.3
  - type: ExplosionResistance
    damageCoefficient: 0.9

