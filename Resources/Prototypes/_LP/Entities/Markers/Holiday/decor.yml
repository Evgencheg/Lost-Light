- type: entity
  parent: LPHolidayMarkerBase
  id: LPHolidayMarkerChristmasTree
  name: holiday marker (christmas tree)
  components:
  - type: Sprite
    layers:
    - state: pink
  - type: HolidaySpawnerMarker
    holiday: NewYear
    extraHolidays:
    - Christmas
    - LPOrthodoxChristmas
    - LPOldNewYear
    spawn: FloraTreeChristmas01

