# Placeholder sprites: reused camera bug and spectral locator, see docs/design/phones-bug.md
- type: entity
  parent: BaseItem
  id: LPTelephoneBugCassette
  name: bug cassette tape
  description: A tiny magnetic tape with a lot of capacity.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Devices/cassette_tapes.rsi
    layers:
    - state: tape_greyscale
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: tape_ribbonoverlay
      map: [ "enum.ToggleableVisuals.Layer" ]
      visible: false
  - type: Item
    size: Tiny
  - type: Damageable
  - type: TapeCassette
    maxCapacity: 900
    repairWhitelist:
      tags:
      - Screwdriver
      - Write
  - type: FitsInTapeRecorder
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: LPTapeRecorderFed
  id: LPTelephoneBug
  name: telephone bug
  description: A tiny recorder that hides inside a phone and records its calls. Use it on a phone, then take it back out and play the tape.
  components:
  - type: Sprite
    sprite: Objects/Devices/camera_bug.rsi
    state: camera_bug
  - type: Item
    size: Tiny
  - type: TelephoneBug
  - type: ContainerFill
    containers:
      cassette_tape:
      - LPTelephoneBugCassette

- type: entity
  parent: BaseItem
  id: LPTelephoneBugDetector
  name: bug detector
  description: A handheld sweeper. Beeps faster the closer a bugged phone is.
  components:
  - type: Sprite
    sprite: Objects/Fun/spectrallocator.rsi
    layers:
    - state: icon
    - state: screen
      shader: unshaded
      visible: false
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggle
  - type: TelephoneBugDetector
    range: 6
  - type: Beeper
    isMuted: true
    minBeepInterval: 0.25
    maxBeepInterval: 1.5
    beepSound:
      path: "/Audio/Items/locator_beep.ogg"
      params:
        maxDistance: 1
        volume: -8

- type: entity
  id: LPCrateTelephoneBugDetector
  parent: CrateGenericSteel
  name: bug detector crate
  description: A crate with a handheld bug detector.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage:
        id: LPTelephoneBugDetector

- type: cargoProduct
  id: LPTelephoneBugDetectorCrateCargo
  icon:
    sprite: Objects/Fun/spectrallocator.rsi
    state: icon
  product: LPCrateTelephoneBugDetector
  cost: 800
  category: cargoproduct-category-name-security
  group: market

- type: listing
  id: LPUplinkTelephoneBug
  name: uplink-telephone-bug-name
  description: uplink-telephone-bug-desc
  productEntity: LPTelephoneBug
  discountCategory: usualDiscounts
  discountDownTo:
    Telecrystal: 1
  cost:
    Telecrystal: 2
  categories:
  - UplinkDisruption
