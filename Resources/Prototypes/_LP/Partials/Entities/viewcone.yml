# Конус зрения: сужение в софткрите и крите (значения как у Funky Station)

- type: !PartialOnly entity
  id: MobDamageable
  components:
  - type: ViewconeMobStateModifier
    modifiers:
      SoftCritical: -110
      Critical: -360

# Шкафы и ящики: вместо слепоты Starlight (ChildBlockVision) работает сужение конуса зрения Funky (ViewconeStorageBlindSystem)
- type: !PartialOnly entity
  id: ClosetBase
  components:
  - type: !Remove ChildBlockVision

- type: !PartialOnly entity
  id: CrateGeneric
  components:
  - type: !Remove ChildBlockVision
