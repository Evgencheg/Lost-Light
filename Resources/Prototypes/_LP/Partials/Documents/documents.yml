- type: !PartialOnly entity
  id: PrinterDoc
  components:
  - type: Lathe
    staticPacks:
    - !Remove StarlightDocs
    - LPDocs
  - type: EmagLatheRecipes
    emagStaticPacks:
    - LPPSyndicateDocuments
  - type: DocumentPrinter
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      blueprint: !type:Container
      id: !type:ContainerSlot
  - type: ItemSlots
    slots:
      id:
        name: item-slot-component-slot-name-id-card
        whitelist:
          components:
            - IdCard
