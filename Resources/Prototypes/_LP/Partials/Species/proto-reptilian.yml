# Прото-рептилоиды: спрайты, части тела, смещения и маркировки неоцитов-рептилоидов

- type: !PartialOnly body
  id: NeoReptilian
  slots:
    head:
      part: LPPHeadProtoReptilian
    torso:
      part: LPPTorsoProtoReptilian
    right arm:
      part: LPPRightArmProtoReptilian
    left arm:
      part: LPPLeftArmProtoReptilian
    right hand:
      part: LPPRightHandProtoReptilian
    left hand:
      part: LPPLeftHandProtoReptilian
    right leg:
      part: LPPRightLegProtoReptilian
    left leg:
      part: LPPLeftLegProtoReptilian
    right foot:
      part: LPPRightFootProtoReptilian
    left foot:
      part: LPPLeftFootProtoReptilian

- type: !PartialOnly species
  id: NeoReptilian
  sprites: LPPMobNeocyteReptilianSprites

- type: !PartialOnly markingPoints
  id: MobNeoReptilianMarkingLimits
  points:
    FaceCover:
      required: false
      defaultMarkings: !Clear
      - LPPNeoReptilianvisor
    FaceCoverCover:
      required: false
      defaultMarkings: !Remove
    BodyCover:
      required: false
      defaultMarkings: !Remove
    BodyCoverCover:
      required: false
      defaultMarkings: !Remove

- type: !PartialOnly entity
  id: BaseMobNeoReptilian
