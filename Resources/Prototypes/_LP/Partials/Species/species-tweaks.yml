# Правки рас: пол экспериментов, маркировки и туловище фелионоидов

# Эксперименты могут быть любого пола
- type: !PartialOnly species
  id: Experiment
  sexes: !Remove

- type: !PartialOnly markingPoints
  id: MobFelionoidMarkingLimits
  onlyWhitelisted: false

- type: !PartialOnly humanoidBaseSprite
  id: !type:CreateVariants
    values:
    - MobFelionoidTorso
    - MobFelionoidTorsoMale
  baseSprite:
    state: torso_m

- type: !PartialOnly humanoidBaseSprite
  id: MobFelionoidTorsoFemale
  baseSprite:
    state: torso_f

# Ядовитый укус арахнидов (раствор melee - от родителя SolutionWeapon, задан в файле прототипа)
- type: !PartialOnly entity
  id: BaseMobArachnid
  components:
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 4
        Poison: 0.04
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: Mechanotoxin
        Quantity: 1
  - type: MeleeChemicalInjector
    transferAmount: 0.12
    solution: melee
