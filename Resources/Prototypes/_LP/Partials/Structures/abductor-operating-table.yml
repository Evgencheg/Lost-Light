# Операционный стол абдукторов

- type: !PartialOnly entity
  id: AbductorOperatingTable
  components:
    - type: Sprite
      state: !Remove
      layers: !Clear
        - state: operating_table
          map: ["enum.OperatingTableVisualLayers.Base"]
        - sprite: Structures/Furniture/Tables/optable.rsi
          state: vitals_1
          map: ["enum.OperatingTableVisualLayers.Vitals"]
          visible: false
        - sprite: Structures/Furniture/Tables/optable.rsi
          map: ["tank"]
