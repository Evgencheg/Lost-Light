- type: entity
  id: OrganTajaranEyes
  parent: OrganHumanEyes
  name: Tajaran eyes
  suffix: Tajaran
  description: "The eyes of a Tajaran."
  components:
  - type: OrganVisualization
    layer: Eyes
    prototypes:
      Default: MobTajaranEyes
  - type: FunctionalOrgan
    comps:
