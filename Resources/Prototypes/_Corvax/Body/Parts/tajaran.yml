- type: entity
  id: PartTajaran
  parent: [BaseItem, BasePart]
  name: Tajaran body part
  abstract: true
  components:
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 3
          - ReagentId: Blood
            Quantity: 10

- type: entity
  id: TorsoTajaran
  name: Tajaran torso
  parent: [PartTajaran, BaseTorso]
  components:
    - type: Sprite
      sprite: _Corvax/Mobs/Species/Tajaran/parts.rsi
      state: torso
    - type: Extractable
      juiceSolution:
        reagents:
          - ReagentId: Fat
            Quantity: 10
          - ReagentId: Blood
            Quantity: 20

- type: entity
